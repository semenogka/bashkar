services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bashkar
      POSTGRES_PASSWORD: bashkar
      POSTGRES_DB: bashkar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bashkar -d bashkar"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      database_url: postgresql+asyncpg://bashkar:bashkar@db:5432/bashkar
      hf_home: /app/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - hf-cache:/app/.cache/huggingface
    restart: unless-stopped

  bot:
    profiles: ["app"]
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bashkar:bashkar@db:5432/bashkar
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  hf-cache:
