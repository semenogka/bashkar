<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>QA stage</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  iframe { position: absolute; top: 0; left: 0; border: 0; background: #fff; }
</style>
</head>
<body>
<script>
  const params = new URLSearchParams(location.search);
  const w = Number(params.get('w')) || 390;
  const h = Number(params.get('h')) || 844;
  const action = params.get('action') || '';
  const seed = params.get('seed') || '';
  const frame = document.createElement('iframe');
  frame.width = w;
  frame.height = h;
  frame.src = 'study.html?qa=' + Date.now();
  document.body.appendChild(frame);

  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    if (seed && !frame.dataset.seeded) {
      frame.dataset.seeded = '1';
      try {
        frame.contentWindow.localStorage.setItem('beztel_study_progress_v1', seed);
      } catch (e) {}
      frame.src = 'study.html?qa=' + Date.now();
      return;
    }
    const openCurrent = () => {
      const node = doc.querySelector('.level-node--current')
        || doc.querySelector('.level-node--replay')
        || doc.querySelector('.level-node--open');
      if (node) node.click();
    };
    if (action === 'modal') {
      openCurrent();
      setTimeout(openCurrent, 400);
      setTimeout(openCurrent, 1200);
    }
    if (action === 'result') {
      setTimeout(openCurrent, 300);
      let i = 0;
      const tick = () => {
        const opt = doc.querySelector('.study-option[data-correct="1"]');
        if (opt) opt.click();
        i += 1;
        if (i < 5) setTimeout(tick, 1000);
      };
      setTimeout(tick, 1000);
    }
  });
</script>
</body>
</html>
