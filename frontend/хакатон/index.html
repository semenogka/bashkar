<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>БЕЗТЕЛ — Башкирский язык в Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="welcome">

    <div class="welcome-viewport">
        <div class="welcome-shell">
            <!-- Верхняя строка: авторизация только через Telegram -->
            <header class="welcome-top-bar">
                <div class="user-identity">
                    <div class="avatar-frame">
                        <img id="userAvatar" src="" alt="Avatar" class="user-avatar hidden">
                        <div id="avatarFallback" class="avatar-fallback">БТ</div>
                    </div>
                    <div class="user-info">
                        <span class="user-name" id="userName">Гость Telegram</span>
                        <span class="mono-tiny">Telegram WebAuth</span>
                    </div>
                </div>
                <span class="mono-tiny text-amber">№ 01/26</span>
            </header>

            <!-- Центральная композиция: башкирская пчёлка + минималистичная типографика -->
            <main class="welcome-center">
                <div class="welcome-mascot-stage">
                    <div class="mascot-aura"></div>
                    <div class="welcome-mascot-box">
                        <img src="mascot.jpg" onerror="this.onerror=null; this.src='-.png';" alt="Башкирская пчёлка БезТел" class="showcase-img">
                    </div>
                    <span class="welcome-pill">Һаумыһығыҙ!</span>
                </div>

                <div class="welcome-copy">
                    <span class="editorial-kicker">БАШҠОРТ ТЕЛЕ • БАШКИРСКИЙ ЯЗЫК</span>
                    <h1 class="welcome-title">БЕЗ<span>ТЕЛ</span></h1>
                    <p class="welcome-desc">
                        Среда живого башкирского языка. Голосовой чат с носителем, умные карточки и дуэли на скорость прямо в Telegram.
                    </p>
                </div>
            </main>

            <!-- Кнопка перехода в персональный хаб -->
            <footer class="welcome-footer">
                <a href="hub.html" class="welcome-start-btn" id="startLearningBtn">
                    <span>Начать учить язык</span>
                    <span>→</span>
                </a>
                <span class="mono-tiny" id="welcomeAuthHint">Вход выполнен через профиль Telegram</span>
            </footer>
        </div>
    </div>

    <script src="app.js?v=3"></script>
</body>
</html>
