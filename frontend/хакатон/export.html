<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>БЕЗТЕЛ — Экспорт базы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="export">

    <div class="drawer-backdrop hidden" id="drawerBackdrop"></div>

    <div class="app-shell">
        <aside class="app-sidebar" id="appSidebar">
            <div class="sidebar-top">
                <a href="index.html" class="sidebar-brand">
                    <div class="brand-emblem">
                        <img src="mascot.png" onerror="this.onerror=null; this.src='-.png';" alt="БезТел" class="brand-mascot-mini">
                    </div>
                    <div class="brand-titles">
                        <span class="brand-kicker">БАШҠОРТ ТЕЛЕ</span>
                        <h1 class="brand-logo">БЕЗ<span>ТЕЛ</span></h1>
                    </div>
                </a>
                <button type="button" class="drawer-close-btn" id="closeDrawerBtn">✕</button>
            </div>

            <nav class="nav-menu">
                <a href="hub.html" class="nav-item"><span class="nav-index">00</span><span class="nav-label">Мой хаб</span></a>
                <a href="chat.html" class="nav-item"><span class="nav-index">01</span><span class="nav-label">Чат с башкиром</span></a>
                <a href="study.html" class="nav-item"><span class="nav-index">02</span><span class="nav-label">Изучение</span></a>
                <a href="daily.html" class="nav-item"><span class="nav-index">03</span><span class="nav-label">Дейлик</span></a>
                <a href="battles.html" class="nav-item"><span class="nav-index">04</span><span class="nav-label">Состязания</span></a>
                <a href="export.html" class="nav-item active"><span class="nav-index">05</span><span class="nav-label">Экспорт базы</span></a>
                <a href="profile.html" class="nav-item"><span class="nav-index">06</span><span class="nav-label">Профиль</span></a>
            </nav>

            <div class="sidebar-footer">
                <div class="api-status-box">
                    <span class="status-led"></span>
                    <span class="mono-tiny">AI API: Ожидание</span>
                </div>
            </div>
        </aside>

        <div class="workspace-wrapper">
            <header class="editorial-header">
                <div class="header-left-group">
                    <button type="button" class="burger-btn" id="openDrawerBtn"><span></span><span></span><span></span></button>
                    <span class="header-section-title">05 / ЭКСПОРТ БАЗЫ</span>
                </div>
                <div class="user-identity">
                    <span class="streak-chip" id="headerStreak">0 🔥</span>
                    <div class="avatar-frame">
                        <img id="userAvatar" src="" alt="Avatar" class="user-avatar hidden">
                        <div id="avatarFallback" class="avatar-fallback">БТ</div>
                    </div>
                    <span class="user-name" id="userName">Ученик</span>
                </div>
            </header>

            <main class="editorial-main">
                <div class="section-bar-minimal">
                    <h2 class="section-title">Экспорт базы</h2>
                </div>

                <div class="panel-card">
                    <div class="card-top-meta">
                        <span class="mono-tiny">ЗАПИСЕЙ В БУФЕРЕ: <strong id="exportCountVal">0</strong></span>
                        <div class="btn-row-clean">
                            <button type="button" class="btn-xs" id="downloadJsonBtn">JSON</button>
                            <button type="button" class="btn-primary-clean" id="downloadCsvBtn">Скачать CSV ↓</button>
                        </div>
                    </div>
                    <div class="empty-slot-box" id="exportPreviewSlot" data-model-slot="export-table">
                        <p>Слова, сгенерированные моделью, автоматически появятся здесь для выгрузки.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
